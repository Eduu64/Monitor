services:
  pcmonitor:
    build: .
    container_name: pcmonitor
    restart: unless-stopped        # arranca solo con el equipo
    network_mode: host             # ve la IP real del equipo, no la del bridge
    pid: host                      # necesario para apagar el equipo (señal a systemd)
    security_opt:
      - apparmor=unconfined        # el perfil por defecto bloquea señales al PID 1 del host
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [KILL]
    read_only: true
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
