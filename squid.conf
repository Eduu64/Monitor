# ============================================================================
#  Proxy de salida del monitor — única puerta a internet de todo el stack
# ============================================================================
# Este squid SOLO acepta conexiones del contenedor del monitor (red interna
# fija 172.30.101.0/24) y SOLO deja pasar HTTPS (CONNECT al puerto 443) hacia
# los dominios de Discord. Todo lo demás queda denegado: otros dominios,
# direcciones IP directas y cualquier puerto que no sea 443.
#
# Para permitir otro dominio (p. ej. un servicio de notificaciones nuevo):
#   1) acl <nombre> dstdomain .servicio.com
#   2) http_access allow <nombre>   (justo antes de "http_access deny all")
#   3) docker compose restart proxy
# ============================================================================

http_port 3128

# --- ACLs ------------------------------------------------------------------
acl cliente src 172.30.101.0/24        # solo el monitor puede usar el proxy
acl discord dstdomain .discord.com     # API de Discord (discord.com y subdominios)
acl SSL_ports port 443                 # solo TLS
acl CONNECT method CONNECT

# --- Política de acceso (la primera regla que aplica decide) ----------------
http_access deny !cliente              # nadie ajeno a la red interna
http_access deny !SSL_ports            # nada que no sea TLS al 443
http_access allow discord              # CONNECT *.discord.com:443
http_access deny all                   # el resto: fuera

# --- Higiene y registros ----------------------------------------------------
cache deny all                         # no cachear nada (solo tunelamos)
via off                                # no anunciar que pasa por un proxy
forwarded_for delete                   # no filtrar la IP del cliente
access_log stdio:/dev/stdout           # registro al stdout del contenedor
cache_log /dev/null
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
visible_hostname pcmonitor-proxy
