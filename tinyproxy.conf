# ============================================================================
#  Tinyproxy — proxy de SALIDA del stack de monitorización
# ============================================================================
#  Es el único contenedor con internet y el único punto por donde puede
#  salir tráfico del monitor. Política, en orden:
#    1. Solo acepta conexiones del monitor (Allow = subred interna) y del
#       propio contenedor (127.0.0.1, para el healthcheck).
#    2. Solo deja pasar CONNECT al puerto 443 (ConnectPort).
#    3. Lista blanca de dominios: lo que no case con "permitidos" → 403.
#
#  OJO: Tinyproxy NO admite comentarios al final de una línea (dan
#  "Syntax error" y el proxy no arranca). Los comentarios van SIEMPRE en
#  su propia línea, como aquí. Si lo editas, respeta ese formato.
#
#  Para añadir otro dominio NO se toca este fichero: edita "permitidos".
# ============================================================================

# Baja privilegios tras arrancar (imagen Alpine: usuario nobody, uid 65534)
User nobody
Group nobody

# Escucha en el 3128 dentro de las redes del compose (sin puertos publicados)
Port 3128

# Corte por inactividad y tope de conexiones (acota la RAM que puede gastar)
Timeout 120
MaxClients 10

# Logs: si NO se define LogFile, tinyproxy escribe a fileno(stdout) (fd 1),
# que Docker captura directamente. NO poner LogFile "/dev/stdout": tinyproxy
# rechaza symlinks al abrir ficheros y /dev/stdout lo es (error "changed
# before it could be opened" o "permission denied" tras bajar a nobody).
LogLevel Connect

# Sin cabecera Via: no revela a Discord que hay un proxy en medio
DisableViaHeader Yes

# --- Quién puede usar el proxy ----------------------------------------------
# La subred es LA MISMA que la de la red "monitor" en docker-compose.yml.
# Si cambias la subred, cambiala en los DOS ficheros.
Allow 127.0.0.1
Allow 10.213.101.0/24

# --- Qué puede alcanzar -------------------------------------------------------
# CONNECT solo hacia 443 (HTTPS); cualquier otro puerto → 403
ConnectPort 443

# --- Lista blanca -------------------------------------------------------------
# Lo que NO case con el fichero "permitidos" queda bloqueado con 403.
# Cada línea es una regex POSIX sobre el dominio, sin puerto (tinyproxy
# lo separa antes de filtrar). Detalles en el propio "permitidos".
Filter "/etc/tinyproxy/permitidos"
FilterDefaultDeny Yes
FilterURLs No
FilterCaseSensitive No
